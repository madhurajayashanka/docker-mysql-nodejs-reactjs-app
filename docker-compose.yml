version: "3.8"

services:
  mysql:
    restart: always
    image: mysql
    environment:
      - MYSQL_DATABASE=appdb
      - MYSQL_PASSWORD=pass123
      - MYSQL_ROOT_PASSWORD=pass123
    networks:
      - project-net
    volumes:
      - ./mysql-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ppass123 || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    networks:
      - project-net
    depends_on:
      mysql:
        condition: service_healthy   

  frontend:
    restart: on-failure
    build:
      context: ./frontend
    ports:
      - "3001:3000"
    networks:
      - project-net
    depends_on:
      - backend
        

networks:
  project-net:
volumes:
  mysql-db:
